name: Convert sheet and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 1-5"   # 8:00 pm IST on weekdays, after the exchanges publish end-of-day files

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached exchange files
        uses: actions/cache/restore@v4
        with:
          path: data/liq/raw
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Convert uploaded sheets to dashboard data
        run: |
          pip install --quiet openpyxl requests
          python scripts/convert.py

      - name: Cache exchange files for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/liq/raw
          key: bhav-${{ github.run_id }}

      - name: Save converted data back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update dashboard data"
            git push
          fi

      - name: Build site folder
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r data icons _site/
          rm -rf _site/data/liq/raw
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
